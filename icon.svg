<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Neon Purple to Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <!-- Gold Gradient for Star -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4" />

  <!-- Center Composition: Film Reel & Play Icon -->
  <g transform="translate(64, 58)">
    <!-- Outer Film Reel Circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Outer Reel Holes -->
    <circle cx="0" cy="-20" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="0" cy="20" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="-20" cy="0" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="20" cy="0" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="-14" cy="-14" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="14" cy="14" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="14" cy="-14" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />
    <circle cx="-14" cy="14" r="5" fill="#020617" stroke="url(#accentGrad)" stroke-width="2" />

    <!-- Center Play Triangle (The "Play" action) -->
    <polygon points="-6,-10 -6,10 12,0" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- Golden Rating Star on the Bottom-Right -->
  <polygon points="98,80 102,89 112,91 105,98 107,108 98,103 89,108 91,98 84,91 94,89" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
